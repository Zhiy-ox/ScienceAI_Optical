# Production-style compose: API + dashboard + durable backing services.
#
# Differs from docker-compose.yml (which only provides the backing services for
# local dev) by also building and running the application containers, wiring the
# durable Postgres checkpointer, and reading secrets from a .env file.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Provide OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY (or LLM_BACKEND=cli)
# and a public dashboard origin via .env before deploying.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scienceai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scienceai}
      POSTGRES_DB: scienceai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scienceai"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.6
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn science_ai.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: postgresql+asyncpg://scienceai:${POSTGRES_PASSWORD:-scienceai}@postgres:5432/scienceai
      CHECKPOINTER_DSN: postgresql://scienceai:${POSTGRES_PASSWORD:-scienceai}@postgres:5432/scienceai
      QDRANT_URL: http://qdrant:6333
      LLM_BACKEND: ${LLM_BACKEND:-api}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  qdrantdata:
