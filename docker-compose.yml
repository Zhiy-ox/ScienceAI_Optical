services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scienceai
      POSTGRES_PASSWORD: scienceai
      POSTGRES_DB: scienceai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
